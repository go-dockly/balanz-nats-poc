syntax = "proto3";

package meter.v1;

option go_package = "github.com/go-dockly/balanz-nats-poc/gen/meter/v1;meterv1";

import "v1/error.proto";
import "v1/meter.proto";

// IngestService accepts new meter data (simulates the edge / asset connectivity layer).
service IngestService {
  // Ingest a single meter reading. Internally calls the NATS publisher service.
  rpc IngestReading(IngestReadingRequest) returns (IngestReadingResponse);
}

message IngestReadingRequest {
  MeterReading reading = 1;
}

message IngestReadingResponse {
  bool accepted = 1;
  string message_id = 2;        // NATS message sequence / id if published
  common.v1.DomainError error = 3;
}
