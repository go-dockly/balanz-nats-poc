syntax = "proto3";

package meter.v1;

option go_package = "github.com/go-dockly/balanz-nats-poc/gen/meter/v1;meterv1";

import "google/protobuf/timestamp.proto";

// Real-time metering reading from an asset (solar/wind/storage/smart meter).
message MeterReading {
  string asset_id = 1;          // e.g. "NL-SOLAR-042"
  string meter_id = 2;
  double active_power_kw = 3;   // instantaneous active power
  double energy_kwh = 4;        // cumulative or interval energy
  google.protobuf.Timestamp timestamp = 5;
  map<string, string> labels = 6; // location, type, etc.
}
